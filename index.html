<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood — A Detective Mystery</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0806; font-family: 'Georgia', serif; color: #c8b8a8; }
canvas { display: block; }

#ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

#locName { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); color: #b8a898; font-size: 13px; letter-spacing: 4px; font-family: 'Courier New', monospace; opacity: 0; transition: opacity 1s; }
#locName.visible { opacity: 0.6; }

#inventory { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; }
#inventory .slot { width: 42px; height: 42px; border: 1px solid rgba(180,160,140,0.15); display: flex; align-items: center; justify-content: center; font-size: 18px; background: rgba(10,8,6,0.6); opacity: 0.3; transition: all 0.4s; border-radius: 4px; }
#inventory .slot.filled { opacity: 0.8; border-color: rgba(200,170,130,0.3); }
#inventory .slot .hint { display: none; position: absolute; top: 50px; right: 0; background: rgba(10,8,6,0.9); border: 1px solid rgba(180,160,140,0.2); padding: 6px 10px; font-size: 11px; white-space: nowrap; font-family: 'Courier New', monospace; color: #a89888; border-radius: 3px; }
#inventory .slot:hover .hint { display: block; }

#dialogue { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: min(620px, 85%); background: linear-gradient(180deg, rgba(10,8,6,0) 0%, rgba(10,8,6,0.85) 25%, rgba(10,8,6,0.95) 100%); opacity: 0; transition: opacity 0.6s; pointer-events: all; padding: 24px 24px 16px; border-top: 1px solid rgba(180,160,140,0.08); }
#dialogue.visible { opacity: 1; }
#dialogue .name { color: #b8a060; font-size: 12px; letter-spacing: 2px; font-family: 'Courier New', monospace; margin-bottom: 8px; }
#dialogue .text { color: #d8c8b8; font-size: 16px; line-height: 1.8; min-height: 2.5em; }
#dialogue .choices { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
#dialogue .choices .btn { background: rgba(180,160,140,0.06); border: 1px solid rgba(180,160,140,0.12); padding: 10px 16px; color: #c8b8a8; font-size: 14px; cursor: pointer; pointer-events: all; text-align: left; transition: all 0.3s; font-family: 'Georgia', serif; border-radius: 3px; }
#dialogue .choices .btn:hover { background: rgba(180,160,140,0.12); border-color: rgba(180,160,140,0.25); color: #e8d8c8; }
#dialogue .cont { color: #5a4a3a; font-size: 11px; margin-top: 12px; opacity: 0; transition: opacity 0.3s; font-family: 'Courier New', monospace; letter-spacing: 1px; }
#dialogue .cont.show { opacity: 0.5; cursor: pointer; }

#travelBtn { position: absolute; bottom: 30px; right: 30px; padding: 10px 22px; background: rgba(10,8,6,0.85); border: 1px solid rgba(180,160,140,0.15); color: #b8a898; font-size: 12px; cursor: pointer; pointer-events: all; font-family: 'Courier New', monospace; letter-spacing: 2px; opacity: 0; transition: all 0.5s; }
#travelBtn.visible { opacity: 0.7; }
#travelBtn:hover { opacity: 1; border-color: rgba(200,170,130,0.3); }

#hint { position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%); color: #4a3a2a; font-size: 11px; font-family: 'Courier New', monospace; opacity: 0; transition: opacity 1s; letter-spacing: 2px; text-align: center; }
#hint.visible { opacity: 0.4; }

#fade { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 30; pointer-events: none; opacity: 0; transition: opacity 0.8s; }

#final { display: none; }
#final.visible { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; justify-content: center; align-items: center; flex-direction: column; background: radial-gradient(ellipse at center, rgba(10,8,6,0.97) 0%, rgba(0,0,0,0.99) 100%); z-index: 40; pointer-events: all; padding: 20px; }
#final p { color: #d8c8b8; font-size: 18px; text-align: center; max-width: 560px; line-height: 1.9; font-style: italic; opacity: 0; animation: fadeUp 2s ease forwards; animation-delay: 0.5s; }
#final .sub { color: #7a6a5a; font-size: 12px; margin-top: 18px; opacity: 0; animation: fadeUp 2s ease forwards; animation-delay: 4s; letter-spacing: 1px; font-family: 'Courier New', monospace; }
#final .btn-wrap { opacity: 0; animation: fadeUp 1.5s ease forwards; animation-delay: 5.5s; margin-top: 20px; }
#final .btn { padding: 10px 36px; border: 1px solid rgba(180,160,140,0.2); background: transparent; color: #b8a060; font-size: 12px; cursor: pointer; letter-spacing: 3px; font-family: 'Courier New', monospace; transition: all 0.3s; }
#final .btn:hover { background: rgba(180,160,140,0.08); border-color: rgba(200,170,130,0.3); }

@keyframes fadeUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
</style>
</head>

<div id="ui">

  <div id="inventory"></div>
  <div id="dialogue">
    <div class="name" id="dName"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── DATA ───────────────────────────────────────────
const NPC_DATA = [
  {
    id: 'mercer', name: 'Old Man Mercer', shape: 'octahedron', color: 0xd4a060,
    pos: [-2.2, 0, -2.0], rotY: 0.7,
    intro: 'Eh? Who\u2019s there at this hour? Oh\u2014a detective. Finally. Someone asking questions.',
    questions: [
      { q: 'What did you see the night Lydia disappeared?',
        a: 'I couldn\u2019t sleep. Bad hip. Around midnight I saw her walking toward the old Miller house. Carrying a bag. Looked scared.' },
      { q: 'Was Lydia acting strange before that?',
        a: 'She was jumpy. Kept looking over her shoulder. But she wasn\u2019t crazy. Folks round here said she was. I disagree.' },
    ],
    farewell: 'I hope you find answers, detective. Someone deserves the truth.',
    item: { name: 'Rusty Key', icon: '\uD83D\uDDDD', desc: 'An old iron key. Might open something on the Miller property.',
      give: 'Almost forgot\u2014I found this key by the fountain last week. Try it on the Miller house lock.' }
  },
  {
    id: 'elara', name: 'Elara Voss', shape: 'sphere', color: 0x4ab0a0,
    pos: [2.5, 0, -1.8], rotY: -0.5,
    intro: 'Detective. I was wondering when someone would come. Lydia\u2019s been gone three months. No one seemed to care.',
    questions: [
      { q: 'What did Lydia buy before she vanished?',
        a: 'Candles. Rope. Canned food. A lantern. I asked if she was going camping. She said yes. In winter. I knew she was lying.' },
      { q: 'Did she mention anyone following her?',
        a: 'She kept whispering about \u201cher.\u201d I asked who. She just said \u201cmy sister\u201d and went pale. Then she left.' },
    ],
    farewell: 'Find her, detective. Whatever\u2019s left to find.',
    item: { name: 'Newspaper Clipping', icon: '\uD83D\uDCF0', desc: 'A 20-year-old article about the Miller house fire. One casualty: a 7-year-old girl.',
      give: 'Here. An old clipping about the Miller fire. I\u2019ve kept it twenty years. Something never sat right.' }
  },
  {
    id: 'finch', name: 'Dr. Helena Finch', shape: 'icosahedron', color: 0x5a8ab0,
    pos: [0.2, 0, 2.8], rotY: Math.PI,
    intro: 'Ah, the detective. Lydia was my patient. I\u2019ve been worried sick. Please, sit down.',
    questions: [
      { q: 'What was Lydia being treated for?',
        a: 'Severe anxiety. Night terrors. She claimed someone watched her through the walls. I prescribed sedatives. They barely helped.' },
      { q: 'Did she have any family history?',
        a: 'She was adopted after the Miller fire. Lately she\u2019d been researching twin genetics. I thought it was academic. Now I wonder.' },
    ],
    farewell: 'I broke confidentiality. I hope it was the right choice.',
    item: { name: 'Medical Records', icon: '\uD83D\uDCCB', desc: 'Lydia\u2019s file. Notes on twin genetics research. A name underlined: Emily Miller.',
      give: 'Her medical records. The last page\u2014she underlined a name. Emily Miller. Her sister. The one who died in the fire. Or so we thought.' }
  },
];

const LOCATIONS = {
  square: { name: 'TOWN SQUARE \u2014 BLACKWOOD' },
  house: { name: 'MILLER HOUSE \u2014 BASEMENT' },
};

const HOUSE_DIALOGUE = [
  'The door groans open. Dust and silence pour out.',
  'You step inside. The air is cold. A figure stands in the corner.',
  '\u201cYou... you actually came. No one ever comes here.\u201d',
  'She steps into the light. She has Lydia\u2019s face.',
  '\u201cI\u2019m Emily. Lydia\u2019s twin. The one who died in the fire.\u201d',
  '\u201cI didn\u2019t die. I escaped. I\u2019ve been hiding in this basement for twenty years.\u201d',
  '\u201cLydia found me six months ago. She was going to tell the town. She was going to save me.\u201d',
  '\u201cBut the mayor found out first. The fire was his fault\u2014bad wiring in the building he owned.\u201d',
  '\u201cHe covered it up. And when Lydia threatened to expose him, he had her committed.\u201d',
  '\u201cShe\u2019s not missing, detective. She\u2019s locked away in Cedarbrook Asylum. And no one believes me.\u201d',
  'She looks at you with Lydia\u2019s eyes. \u201cWill you help me?\u201d',
];

const ENDINGS = {
  expose: {
    line: '"I believe you, Emily. Let\u2019s end this."',
    story: 'You found the evidence. You found your voice. The mayor was arrested that night. Emily walked free for the first time in twenty years. The truth didn\u2019t set her free\u2014you did.',
    final: 'The garden grew where the house once stood. Two sisters, together again, planting flowers in the ashes.',
  },
  escape: {
    line: '"I believe you. But I can\u2019t fight the mayor. Go. Disappear."',
    story: 'You gave her your coat and your silence. She left that night. A letter arrived a week later, postmarked from a city you\u2019d never heard of. "Thank you for listening. That\u2019s all I ever needed."',
    final: 'Some cases don\u2019t end in courtrooms. They end in quiet goodbyes. You closed the file, but you never closed the door on her.',
  },
};

// ─── STATE ───────────────────────────────────────────
const S = {
  location: 'square', phase: 'intro', npcIdx: -1, qIdx: 0,
  inventory: [],
  npc: NPC_DATA.map(() => ({ talkedTo: false, asked: [], itemGiven: false })),
  houseStep: 0,
  ending: null,
  canInteract: false,
  dialogOpen: false,
};

// ─── THREE.JS SETUP ─────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0810);
scene.fog = new THREE.Fog(0x0a0810, 12, 22);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 40);
camera.position.set(4, 3, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI / 2.05;
controls.update();

const ambient = new THREE.AmbientLight(0x1a1a2a, 0.3);
scene.add(ambient);
const moon = new THREE.DirectionalLight(0x8888cc, 0.3);
moon.position.set(-5, 10, -5);
scene.add(moon);

const npcMeshes = [];
const npcGroups = [];

function createNPCMesh(data) {
  const group = new THREE.Group();
  let geo;
  if (data.shape === 'octahedron') geo = new THREE.OctahedronGeometry(0.35, 0);
  else if (data.shape === 'sphere') geo = new THREE.SphereGeometry(0.33, 8, 8);
  else geo = new THREE.IcosahedronGeometry(0.33, 0);

  const mat = new THREE.MeshStandardMaterial({
    color: data.color, emissive: data.color, emissiveIntensity: 0.2,
    roughness: 0.3, metalness: 0.7, transparent: true, opacity: 0,
  });
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);

  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.45, 8, 8),
    new THREE.MeshBasicMaterial({ color: data.color, transparent: true, opacity: 0, side: THREE.BackSide })
  );
  group.add(glow);

  const labelCanvas = document.createElement('canvas');
  labelCanvas.width = 300; labelCanvas.height = 60;
  const ctx = labelCanvas.getContext('2d');
  ctx.fillStyle = 'rgba(6,4,3,0.7)';
  ctx.beginPath(); ctx.roundRect(10, 8, 280, 44, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(180,160,140,0.15)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(10, 8, 280, 44, 6); ctx.stroke();
  ctx.fillStyle = '#c8b8a8'; ctx.font = '18px "Georgia"'; ctx.textAlign = 'center';
  ctx.fillText(data.name, 150, 40);
  const labelTex = new THREE.CanvasTexture(labelCanvas);
  const labelMat = new THREE.SpriteMaterial({ map: labelTex, transparent: true, opacity: 0, depthTest: false, sizeAttenuation: true });
  const label = new THREE.Sprite(labelMat);
  label.scale.set(1.6, 0.32, 1);
  label.position.y = 0.9;
  group.add(label);

  const [x, y, z] = data.pos;
  group.position.set(x, y, z);
  group.userData.npcIdx = NPC_DATA.indexOf(data);
  scene.add(group);
  npcGroups.push(group);
  npcMeshes.push(mesh);
  return { group, mesh, mat, glow, label, labelMat };
}

const npcObjects = NPC_DATA.map(d => createNPCMesh(d));

function createTown() {
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(10, 64),
    new THREE.MeshStandardMaterial({ color: 0x1a1512, roughness: 0.9 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const cobble = new THREE.Mesh(
    new THREE.CircleGeometry(4.5, 32),
    new THREE.MeshStandardMaterial({ color: 0x221d18, roughness: 0.95 })
  );
  cobble.rotation.x = -Math.PI / 2;
  cobble.position.y = 0.01;
  scene.add(cobble);

  function bldg(x, z, w, h, d, color) {
    const g = new THREE.Group();
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.85 }));
    wall.position.set(x, h/2, z); wall.castShadow = true;
    g.add(wall);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(w * 0.75, h * 0.35, 4), new THREE.MeshStandardMaterial({ color: 0x2a221a, roughness: 0.9 }));
    roof.position.set(x, h + h * 0.17, z);
    roof.rotation.y = Math.PI / 4;
    g.add(roof);
    for (let i = 0; i < 4; i++) {
      const win = new THREE.Mesh(
        new THREE.PlaneGeometry(0.2, 0.3),
        new THREE.MeshBasicMaterial({ color: 0x3a2a1a, transparent: true, opacity: 0.3 })
      );
      const wx = x + (i < 2 ? -1 : 1) * w * 0.25;
      const wz = z + (i % 2 === 0 ? -1 : 1) * d * 0.25;
      win.position.set(wx, h * 0.45, wz);
      g.add(win);
    }
    scene.add(g);
    return g;
  }

  bldg(-4.0, -2.5, 1.8, 1.6, 1.8, 0x2a221d); // left
  bldg(3.8, -2.5, 1.6, 1.8, 1.6, 0x221d18); // right
  bldg(4.2, 2.8, 2.0, 1.4, 1.6, 0x2a221d); // back right
  bldg(-4.2, 2.5, 1.8, 1.6, 1.8, 0x221d18); // back left

  function tree(x, z) {
    const t = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.1, 0.5, 4), new THREE.MeshStandardMaterial({ color: 0x1a1510 }));
    trunk.position.y = 0.25;
    t.add(trunk);
    const crown = new THREE.Mesh(new THREE.SphereGeometry(0.4, 5, 5), new THREE.MeshStandardMaterial({ color: 0x0a1a0a, roughness: 0.9 }));
    crown.position.y = 0.7; crown.scale.y = 0.8;
    t.add(crown);
    t.position.set(x, 0, z);
    scene.add(t);
  }
  tree(-5.5, -4); tree(5.5, -3.8); tree(-5.8, 4); tree(5.5, 4.2);

  function lamp(x, z) {
    const g = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 1.2, 6), new THREE.MeshStandardMaterial({ color: 0x1a1510 }));
    pole.position.y = 0.6;
    g.add(pole);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffcc88 }));
    bulb.position.set(0, 1.25, 0);
    g.add(bulb);
    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffcc88, transparent: true, opacity: 0.06 }));
    glow.position.copy(bulb.position);
    g.add(glow);
    g.position.set(x, 0, z);
    scene.add(g);
    const pl = new THREE.PointLight(0xffcc88, 0.3, 3);
    pl.position.set(x, 1.3, z);
    scene.add(pl);
  }
  lamp(-2.8, -3.2); lamp(2.8, -3.2); lamp(-3.0, 3.5); lamp(3.0, 3.5);

  const fountain = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 0.2, 8), new THREE.MeshStandardMaterial({ color: 0x2a221d }));
  base.position.y = 0.1;
  fountain.add(base);
  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.5, 6), new THREE.MeshStandardMaterial({ color: 0x2a221d }));
  pillar.position.y = 0.45;
  fountain.add(pillar);
  const bowl = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.05, 6, 12), new THREE.MeshStandardMaterial({ color: 0x2a221d }));
  bowl.position.y = 0.75; bowl.rotation.x = Math.PI / 2;
  fountain.add(bowl);
  fountain.position.set(0, 0, 0.5);
  scene.add(fountain);

  const houseGroup = new THREE.Group();
  houseGroup.position.set(0, 0, 8);
  const hw = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.2, 2.8), new THREE.MeshStandardMaterial({ color: 0x1a1512, roughness: 0.9 }));
  hw.position.y = 1.1;
  houseGroup.add(hw);
  const hr = new THREE.Mesh(new THREE.ConeGeometry(2.2, 0.8, 4), new THREE.MeshStandardMaterial({ color: 0x2a1a10, roughness: 0.9 }));
  hr.position.y = 2.6; hr.rotation.y = Math.PI / 4;
  houseGroup.add(hr);
  houseGroup.visible = false;
  scene.add(houseGroup);
  return houseGroup;
}

let houseExterior = createTown();

// ─── HOUSE INTERIOR ──────────────────────────────────
let houseScene = null;
function createHouseInterior() {
  const g = new THREE.Group();

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), new THREE.MeshStandardMaterial({ color: 0x0a0806, roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.05;
  g.add(floor);

  const w1 = new THREE.Mesh(new THREE.PlaneGeometry(5, 3), new THREE.MeshStandardMaterial({ color: 0x0f0c08, side: THREE.DoubleSide, roughness: 0.9 }));
  w1.position.set(0, 1.5, -2.5); g.add(w1);
  const w2 = new THREE.Mesh(new THREE.PlaneGeometry(5, 3), new THREE.MeshStandardMaterial({ color: 0x0f0c08, side: THREE.DoubleSide, roughness: 0.9 }));
  w2.position.set(2.5, 1.5, 0); w2.rotation.y = Math.PI / 2; g.add(w2);
  const w3 = new THREE.Mesh(new THREE.PlaneGeometry(5, 3), new THREE.MeshStandardMaterial({ color: 0x0f0c08, side: THREE.DoubleSide, roughness: 0.9 }));
  w3.position.set(-2.5, 1.5, 0); w3.rotation.y = -Math.PI / 2; g.add(w3);

  const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.15, 6), new THREE.MeshBasicMaterial({ color: 0xd4a060 }));
  candle.position.set(0.3, 0.1, -0.5);
  g.add(candle);
  const flame = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6), new THREE.MeshBasicMaterial({ color: 0xff8844 }));
  flame.position.set(0.3, 0.2, -0.5);
  g.add(flame);

  const pl = new THREE.PointLight(0xff8844, 0.6, 4);
  pl.position.set(0.3, 0.5, -0.5);
  g.add(pl);

  const emilyMat = new THREE.MeshStandardMaterial({
    color: 0x886688, emissive: 0x664466, emissiveIntensity: 0.15,
    roughness: 0.3, metalness: 0.5, transparent: true, opacity: 0,
  });
  const emily = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 0), emilyMat);
  emily.position.set(-0.5, 0.35, 0.8);
  g.add(emily);

  const emilyGlow = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0x886688, transparent: true, opacity: 0, side: THREE.BackSide })
  );
  emilyGlow.position.copy(emily.position);
  g.add(emilyGlow);

  const emilyLabel = (() => {
    const c = document.createElement('canvas'); c.width = 300; c.height = 60;
    const ctx = c.getContext('2d');
    ctx.fillStyle = 'rgba(6,4,3,0.7)'; ctx.beginPath(); ctx.roundRect(10, 8, 280, 44, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(180,160,140,0.15)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(10, 8, 280, 44, 6); ctx.stroke();
    ctx.fillStyle = '#c8b8a8'; ctx.font = '18px "Georgia"'; ctx.textAlign = 'center';
    ctx.fillText('Emily Miller', 150, 40);
    const t = new THREE.CanvasTexture(c);
    const m = new THREE.SpriteMaterial({ map: t, transparent: true, opacity: 0, depthTest: false });
    const s = new THREE.Sprite(m); s.scale.set(1.6, 0.32, 1);
    s.position.set(-0.5, 0.9, 0.8);
    return s;
  })();
  g.add(emilyLabel);

  g.visible = false;
  scene.add(g);
  houseScene = { group: g, emily, emilyMat, emilyGlow, emilyLabel, flame, candle, pl };
  return houseScene;
}
createHouseInterior();

// ─── RAYCASTER ───────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoverNPC = null;

function getNPCIntersects() {
  const hits = raycaster.intersectObjects(npcMeshes);
  if (hits.length) {
    const g = hits[0].object.parent;
    if (g && g.userData.npcIdx !== undefined) return g.userData.npcIdx;
  }
  return -1;
}

function onMove(e) {
  if (!S.canInteract || S.dialogOpen) { renderer.domElement.style.cursor = 'default'; return; }
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const idx = getNPCIntersects();
  renderer.domElement.style.cursor = idx >= 0 ? 'pointer' : 'default';
  hoverNPC = idx;
}

function onClick(e) {
  if (!S.canInteract || S.dialogOpen) return;
  if (S.phase === 'ending') return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const idx = getNPCIntersects();
  if (idx >= 0 && !S.npc[idx].itemGiven) {
    startNPCDialogue(idx);
  }
}

// ─── DIALOGUE SYSTEM ─────────────────────────────────
let typing = false, skipTyping = false, dialogHandler = null;

function typewrite(el, text, speed, cb) {
  typing = true; skipTyping = false;
  el.innerHTML = '';
  let i = 0;
  const tick = () => {
    if (skipTyping) { el.innerHTML = ''; for (const ch of text) { el.innerHTML += ch === '\n' ? '<br>' : ch; } typing = false; if (cb) cb(); return; }
    if (i < text.length) { const ch = text[i]; el.innerHTML += ch === '\n' ? '<br>' : ch; i++; setTimeout(tick, speed); }
    else { typing = false; if (cb) cb(); }
  };
  tick();
}

function clearDialogue() {
  S.dialogOpen = false;
  document.getElementById('dialogue').className = '';
}

function startNPCDialogue(idx) {
  S.dialogOpen = true;
  S.npcIdx = idx;
  const data = NPC_DATA[idx];
  const nstate = S.npc[idx];
  const box = document.getElementById('dialogue');
  const name = document.getElementById('dName');
  const text = document.getElementById('dText');
  const choices = document.getElementById('dChoices');
  const cont = document.getElementById('dCont');
  box.className = 'visible'; choices.innerHTML = ''; cont.className = '';

  if (!nstate.talkedTo) {
    nstate.talkedTo = true;
    name.textContent = '\u2726 ' + data.name;
    typewrite(text, data.intro, 22, () => {
      cont.textContent = '▼ continue'; cont.className = 'show';
    });
    if (dialogHandler) document.removeEventListener('click', dialogHandler);
    dialogHandler = () => {
      if (typing) { skipTyping = true; return; }
      document.removeEventListener('click', dialogHandler);
      showQuestions(idx);
    };
    document.addEventListener('click', dialogHandler);
  } else {
    showQuestions(idx);
  }
}

function showQuestions(idx) {
  const data = NPC_DATA[idx];
  const nstate = S.npc[idx];
  const text = document.getElementById('dText');
  const choices = document.getElementById('dChoices');
  const cont = document.getElementById('dCont');
  cont.className = '';

  const available = data.questions.filter((_, i) => !nstate.asked.includes(i));

  if (available.length === 0) {
    if (!nstate.itemGiven && data.item) {
      nstate.itemGiven = true;
      S.inventory.push(data.item);
      updateInventory();
      name: name;
      name.textContent = '\u2726 ' + data.name;
      typewrite(text, data.item.give, 22, () => {
        cont.textContent = '▼ ' + data.item.name + ' acquired'; cont.className = 'show';
      });
      if (dialogHandler) document.removeEventListener('click', dialogHandler);
      dialogHandler = () => {
        if (typing) { skipTyping = true; return; }
        document.removeEventListener('click', dialogHandler);
        farewellNPC(idx);
      };
      document.addEventListener('click', dialogHandler);
    } else {
      farewellNPC(idx);
    }
    return;
  }

  const name = document.getElementById('dName');
  name.textContent = '\u2726 ' + data.name;
  text.textContent = 'What would you like to ask?';
  choices.innerHTML = '';

  available.forEach((q, ai) => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '\u2192 ' + q.q;
    btn.addEventListener('click', () => {
      const realIdx = data.questions.indexOf(q);
      nstate.asked.push(realIdx);
      askQuestion(idx, realIdx);
    });
    choices.appendChild(btn);
  });

  if (nstate.asked.length > 0) {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '\u2192 That\u2019s all I needed';
    btn.style.opacity = '0.6';
    btn.addEventListener('click', () => {
      if (!nstate.itemGiven && data.item) {
        nstate.itemGiven = true;
        S.inventory.push(data.item);
        updateInventory();
        document.getElementById('dChoices').innerHTML = '';
        typewrite(text, data.item.give, 22, () => {
          cont.textContent = '▼ ' + data.item.name + ' acquired'; cont.className = 'show';
        });
        if (dialogHandler) document.removeEventListener('click', dialogHandler);
        dialogHandler = () => {
          if (typing) { skipTyping = true; return; }
          document.removeEventListener('click', dialogHandler);
          farewellNPC(idx);
        };
        document.addEventListener('click', dialogHandler);
      } else {
        farewellNPC(idx);
      }
    });
    choices.appendChild(btn);
  }
  cont.className = '';
}

function askQuestion(idx, qi) {
  const data = NPC_DATA[idx];
  const text = document.getElementById('dText');
  const choices = document.getElementById('dChoices');
  const cont = document.getElementById('dCont');
  choices.innerHTML = '';
  cont.className = '';

  typewrite(text, data.questions[qi].a, 22, () => {
    cont.textContent = '▼ continue'; cont.className = 'show';
  });
  if (dialogHandler) document.removeEventListener('click', dialogHandler);
  dialogHandler = () => {
    if (typing) { skipTyping = true; return; }
    document.removeEventListener('click', dialogHandler);
    showQuestions(idx);
  };
  document.addEventListener('click', dialogHandler);
}

function farewellNPC(idx) {
  const data = NPC_DATA[idx];
  const text = document.getElementById('dText');
  const choices = document.getElementById('dChoices');
  const cont = document.getElementById('dCont');
  choices.innerHTML = '';
  name: name;

  typewrite(text, data.farewell, 25, () => {
    cont.textContent = '▼ close'; cont.className = 'show';
  });
  if (dialogHandler) document.removeEventListener('click', dialogHandler);
  dialogHandler = () => {
    if (typing) { skipTyping = true; return; }
    document.removeEventListener('click', dialogHandler);
    clearDialogue();
    checkTravel();
  };
  document.addEventListener('click', dialogHandler);
}

// ─── HOUSE SEQUENCE ──────────────────────────────────
function startHouseSequence() {
  S.phase = 'house';
  S.dialogOpen = true;
  const fade = document.getElementById('fade');
  fade.style.opacity = '1';

  setTimeout(() => {
    scene.background = new THREE.Color(0x040304);
    scene.fog = new THREE.Fog(0x040304, 5, 10);
    camera.position.set(1.5, 1.2, 2.8);
    controls.target.set(0, 0.3, 0);
    controls.minDistance = 1.5;
    controls.maxDistance = 5;
    controls.update();

    npcGroups.forEach(g => g.visible = false);
    houseExterior.visible = false;
    if (houseScene) {
      houseScene.group.visible = true;
      houseScene.emilyMat.opacity = 0;
      houseScene.emilyGlow.material.opacity = 0;
      houseScene.emilyLabel.material.opacity = 0;
    }

    document.getElementById('travelBtn').className = '';
    document.getElementById('locName').textContent = '◆ MILLER HOUSE — BASEMENT';
    document.getElementById('locName').className = 'visible';
    document.getElementById('hint').className = '';

    fade.style.opacity = '0';
    setTimeout(() => {
      playHouseDialogue(0);
    }, 900);
  }, 800);
}

function playHouseDialogue(step) {
  if (step >= HOUSE_DIALOGUE.length) {
    showHouseChoice();
    return;
  }
  S.houseStep = step;
  const box = document.getElementById('dialogue');
  const text = document.getElementById('dText');
  const choices = document.getElementById('dChoices');
  const cont = document.getElementById('dCont');
  box.className = 'visible'; choices.innerHTML = ''; cont.className = '';
  document.getElementById('dName').textContent = '\u2726 ???';

  typewrite(text, HOUSE_DIALOGUE[step], 25, () => {
    cont.textContent = '▼ continue'; cont.className = 'show';
  });

  if (step === 3 || step === 4) {
    const em = houseScene.emily;
    const glow = houseScene.emilyGlow;
    em.material.opacity = Math.min(1, (step - 2) * 0.5);
    glow.material.opacity = Math.min(0.12, (step - 2) * 0.04);
    houseScene.emilyLabel.material.opacity = Math.min(1, (step - 2) * 0.5);
    document.getElementById('dName').textContent = '\u2726 Emily Miller';
  }

  if (dialogHandler) document.removeEventListener('click', dialogHandler);
  dialogHandler = () => {
    if (typing) { skipTyping = true; return; }
    document.removeEventListener('click', dialogHandler);
    playHouseDialogue(step + 1);
  };
  document.addEventListener('click', dialogHandler);
}

function showHouseChoice() {
  const text = document.getElementById('dText');
  const choices = document.getElementById('dChoices');
  const cont = document.getElementById('dCont');
  cont.className = '';
  text.textContent = 'She waits. Her eyes ask the question for her. What do you do?';

  const b1 = document.createElement('button');
  b1.className = 'btn';
  b1.textContent = '\u2192 "I believe you. Let\u2019s end this."';
  b1.addEventListener('click', () => endGame('expose'));
  choices.appendChild(b1);

  const b2 = document.createElement('button');
  b2.className = 'btn';
  b2.textContent = '\u2192 "I believe you. But I can\u2019t help. Go."';
  b2.style.opacity = '0.7';
  b2.addEventListener('click', () => endGame('escape'));
  choices.appendChild(b2);
}

function endGame(type) {
  S.ending = type;
  S.phase = 'ending';
  const end = ENDINGS[type];
  const finalEl = document.getElementById('final');
  const p = finalEl.querySelector('p');
  const sub = finalEl.querySelector('.sub');

  document.getElementById('dialogue').className = '';

  p.innerHTML = end.line + '<br><br>' + end.story;
  sub.textContent = end.final;
  finalEl.className = 'visible';

  if (houseScene) {
    const em = houseScene.emily;
    if (type === 'expose') {
      em.material.color.setHex(0x88bb88);
      em.material.emissive.setHex(0x44aa44);
      em.material.emissiveIntensity = 0.3;
      houseScene.emilyGlow.material.color.setHex(0x88bb88);
    }
  }
}

// ─── TRAVEL ──────────────────────────────────────────
function checkTravel() {
  if (S.inventory.length >= 3) {
    const btn = document.getElementById('travelBtn');
    btn.className = 'visible';
  }
}

document.getElementById('travelBtn').addEventListener('click', () => {
  if (S.inventory.length >= 3) startHouseSequence();
});

// ─── UI HELPERS ──────────────────────────────────────
function updateInventory() {
  const inv = document.getElementById('inventory');
  inv.innerHTML = '';
  S.inventory.forEach(item => {
    const slot = document.createElement('div');
    slot.className = 'slot filled';
    slot.textContent = item.icon;
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = item.name + ' — ' + item.desc;
    slot.appendChild(hint);
    inv.appendChild(slot);
  });
}

// ─── INTRO ───────────────────────────────────────────
function startGame() {
  document.getElementById('locName').className = 'visible';
  document.getElementById('hint').className = 'visible';

  const dur = 1500; const start = performance.now();
  const appear = (t) => {
    const p = Math.min((t - start) / dur, 1); const e = 1 - Math.pow(1 - p, 2);
    npcObjects.forEach((o, i) => {
      o.mat.opacity = e; o.glow.material.opacity = e * 0.08;
      o.labelMat.opacity = e;
    });
    if (p < 1) requestAnimationFrame(appear);
    else { S.canInteract = true; }
  };
  requestAnimationFrame(appear);
}

// ─── MAIN LOOP ───────────────────────────────────────
let time = 0;

function animate(t) {
  requestAnimationFrame(animate);
  controls.update();
  time += 0.01;

  npcObjects.forEach((o, idx) => {
    const bob = Math.sin(time * 0.8 + idx * 1.5) * 0.04;
    o.group.position.y = NPC_DATA[idx].pos[1] + bob;
    o.mesh.rotation.x = time * 0.4 + idx;
    o.mesh.rotation.y = time * 0.6 + idx;
    const pulse = 1 + Math.sin(time * 2 + idx * 2) * 0.02;
    o.mesh.scale.set(pulse, pulse, pulse);
    o.glow.material.opacity = o.mat.opacity * (0.06 + Math.sin(time * 1.5 + idx) * 0.02);
  });

  if (houseScene && houseScene.group.visible) {
    const f = houseScene.flame;
    if (f) {
      const flicker = 0.9 + Math.sin(time * 50) * 0.05 + Math.sin(time * 73) * 0.03;
      f.scale.set(flicker, flicker + 0.1, flicker);
      houseScene.pl.intensity = 0.4 + Math.sin(time * 40) * 0.1 + Math.sin(time * 60) * 0.05;
    }
    const em = houseScene.emily;
    if (em.material.opacity > 0) {
      const pulse = 1 + Math.sin(time * 1.5) * 0.01;
      em.scale.set(pulse, pulse, pulse);
    }
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.addEventListener('pointermove', onMove);
document.addEventListener('pointerdown', onClick);
document.getElementById('stayBtn').addEventListener('click', () => {
  document.getElementById('final').className = '';
  document.querySelector('#dialogue .text').textContent = 'Case closed. Blackwood returns to its quiet rhythm. But the garden at Miller House grows a little wilder every year. A reminder that some truths, once uncovered, bloom regardless of who tends them.';
  document.getElementById('dialogue').className = 'visible';
  document.getElementById('dName').textContent = '\u2726 CASE FILE — BLACKWOOD';
});

startGame();
animate();
console.log('✦ BLACKWOOD — A Detective Mystery');
console.log('✦ Three witnesses. Three clues. One truth.');
</script>
