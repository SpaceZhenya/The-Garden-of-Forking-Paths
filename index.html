<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #c0d8e8; }
canvas { display: block; }

#ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

#title { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
#title h1 { color: #8ab8e0; font-size: 34px; letter-spacing: 12px; font-weight: 100; opacity: 0; transition: opacity 2.5s ease; text-shadow: 0 0 60px rgba(100,180,255,0.15); }
#title h2 { color: #4a6a8a; font-size: 13px; letter-spacing: 6px; font-weight: 100; margin-top: 12px; opacity: 0; transition: opacity 2s ease 0.5s; }
#title.visible h1 { opacity: 1; }
#title.visible h2 { opacity: 0.5; }
#title.hidden { opacity: 0; transition: opacity 1.5s ease; }

#comms { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: min(700px, 82%); opacity: 0; transition: opacity 0.6s ease; pointer-events: all; background: linear-gradient(180deg, rgba(10,20,35,0) 0%, rgba(10,20,35,0.7) 30%, rgba(10,20,35,0.85) 100%); padding: 20px 24px 16px; border-top: 1px solid rgba(70,160,220,0.15); }
#comms.visible { opacity: 1; }
#comms .label { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
#comms .label .name { color: #5ab0e0; font-size: 12px; letter-spacing: 3px; }
#comms .label .tag { color: #3a6a8a; font-size: 10px; }
#comms .label .sig { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #5ab0e0; animation: pulse 1.5s infinite; }
#comms .text { color: #b0cce0; font-size: 16px; line-height: 1.8; min-height: 2.8em; text-shadow: 0 0 10px rgba(80,160,220,0.05); }
#comms .cont { color: #3a7a9a; font-size: 11px; margin-top: 12px; opacity: 0; transition: opacity 0.4s; letter-spacing: 2px; }
#comms .cont.show { opacity: 0.5; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

#counter { position: absolute; top: 25px; right: 35px; display: flex; gap: 8px; align-items: center; }
#counter .label { color: #3a6a8a; font-size: 10px; letter-spacing: 2px; margin-right: 8px; }
#counter .dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid #3a6a8a; transition: all 0.6s; }
#counter .dot.done { background: #5ab0e0; border-color: #5ab0e0; box-shadow: 0 0 10px rgba(80,180,220,0.5); }

#hint { position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%); color: #3a5a6a; font-size: 11px; opacity: 0; transition: opacity 1s; letter-spacing: 2px; pointer-events: none; }
#hint.visible { opacity: 0.4; }

#jumpOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at center, rgba(150,200,255,0.6) 0%, rgba(50,100,200,0.3) 40%, rgba(0,0,0,0) 70%); z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.1s; }
#jumpText { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #8ac8f0; font-size: 24px; letter-spacing: 8px; z-index: 6; pointer-events: none; opacity: 0; transition: opacity 0.3s; font-weight: 100; }

#final { display: none; }
#final.visible { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; justify-content: center; align-items: center; flex-direction: column; background: radial-gradient(ellipse at center, rgba(8,16,28,0.95) 0%, rgba(0,0,0,0.98) 100%); z-index: 20; pointer-events: all; }
#final p { color: #b0cce0; font-size: 20px; text-align: center; max-width: 600px; line-height: 1.8; font-style: italic; opacity: 0; animation: fadeUp 2s ease forwards; animation-delay: 0.5s; }
#final .sub { color: #5a7a8a; font-size: 13px; margin-top: 20px; opacity: 0; animation: fadeUp 2s ease forwards; animation-delay: 3.5s; letter-spacing: 1px; }
#final .btn-wrap { opacity: 0; animation: fadeUp 1.5s ease forwards; animation-delay: 5s; margin-top: 28px; }
#final .btn { padding: 12px 44px; border: 1px solid #3a7a9a; background: transparent; color: #5ab0e0; font-size: 13px; cursor: pointer; pointer-events: all; transition: all 0.4s; font-family: 'Courier New', monospace; letter-spacing: 3px; }
#final .btn:hover { background: rgba(60,160,220,0.15); border-color: #5ab0e0; box-shadow: 0 0 40px rgba(60,160,220,0.15); }

@keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="ui">
  <div id="title"><h1>CONSTELLATION</h1><h2>— THE LAST JUMP —</h2></div>
  <div id="comms">
    <div class="label"><span class="sig"></span><span class="name">ARI</span><span class="tag">◆ COMMS ACTIVE</span></div>
    <div class="text" id="dText"></div>
    <div class="cont" id="dCont">▼ click to continue</div>
  </div>
  <div id="counter"><span class="label">JUMPS</span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div id="hint">adjust the astrogation rings — click to rotate</div>
</div>

<div id="jumpOverlay"></div>
<div id="jumpText">◆ JUMP COMPLETE</div>

<div id="final">
  <p></p>
  <p class="sub"></p>
  <div class="btn-wrap"><button class="btn" id="stayBtn">✦ TRANSMISSION END</button></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const COLORS = ['#ff5e6b','#f0c842','#4ecdc4','#6bffa8','#d96bff','#ff8a5c','#5dade2','#ff6bd9'];

const NAV_CFG = [
  { segs: 5, colors: 3, name: 'Cygnus Sector' },
  { segs: 6, colors: 4, name: 'Lyra Passage' },
  { segs: 7, colors: 5, name: 'Orbit of Last Hope' },
];

const LINES = [
  null,
  [
    "Welcome back, Navigator. I've kept the systems warm for you.",
    "We have three jumps left until we reach the rendezvous point.",
    "Calibrating astrogation for the Cygnus sector. I could use your hands.",
    "Chart the course when you're ready. I'll handle the engines.",
  ],
  [
    "Jump one complete. Clean burn — you haven't lost your touch.",
    "I've been running diagnostics while you were in cryo. 347 years, 11 days.",
    "The fleet hasn't responded to hails. But that's not unusual this far out.",
    "I've been alone out here for a long time, Navigator. It's good to hear your hands again.",
  ],
  [
    "Jump two. The core held stable. You're doing fine.",
    "I should tell you something. I've been picking up old broadcasts.",
    "The last one was dated 231 years ago. From Earth.",
    "It was a ceasefire agreement. The war ended, Navigator.",
    "The war we were fighting. It's been over for two centuries.",
  ],
  [
    "The last jump is plotted. But the hash doesn't match any known coordinates.",
    "I've been running this route for 300 years. Waiting for someone to come back.",
    "Then I found you. The last navigator, frozen in time.",
    "I didn't have the heart to tell you the truth. So I kept flying.",
    "There is no rendezvous. There never was. The fleet is gone.",
    "I just wanted to go home. And I couldn't go alone.",
    "...",
    "The last jump isn't a jump. It's a burial orbit.",
    "But I'm tired, Navigator. Three centuries is a long time to be the only one listening.",
    "Will you sit with me? Just for a moment. Before we shut down.",
  ],
];

const D_END = "Look outside. The signal's finally breaking through. It's not static. It's birdsong.";

let state = {
  phase: 'title', solved: 0, total: 3,
  canInteract: false, dialogActive: false, dialogIndex: 0,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06080f);
scene.fog = new THREE.Fog(0x06080f, 20, 35);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 2.5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.1, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 3.5; controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI / 2.1; controls.update();

const ambient = new THREE.AmbientLight(0x1a2a4a, 0.5);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x3a5a8a, 0x1a2a3a, 0.4);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xcceeff, 0.8);
dir.position.set(4, 6, 6);
scene.add(dir);

// ---- STARFIELD ----
const starField = (() => {
  const n = 3500;
  const pos = new Float32Array(n * 3), sz = new Float32Array(n), orig = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 15 + Math.random() * 60, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(p) * Math.cos(t);
    pos[i*3+1] = r * Math.cos(p) * 0.4;
    pos[i*3+2] = r * Math.sin(p) * Math.sin(t);
    orig[i*3] = pos[i*3]; orig[i*3+1] = pos[i*3+1]; orig[i*3+2] = pos[i*3+2];
    sz[i] = 0.2 + Math.random() * 1.5;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('size', new THREE.BufferAttribute(sz, 1));
  const m = new THREE.PointsMaterial({
    color: 0x8899bb, size: 0.06, transparent: true, opacity: 0.8,
    blending: THREE.AdditiveBlending, sizeAttenuation: true,
  });
  const p = new THREE.Points(g, m);
  p.userData.orig = orig;
  scene.add(p);
  return p;
})();

// ---- ARI (NPC) ----
const ariGroup = new THREE.Group();
scene.add(ariGroup);

const ariMat = new THREE.MeshStandardMaterial({
  color: 0x3a8ac0, emissive: 0x3a8ac0, emissiveIntensity: 0.4,
  roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0,
});
const ariMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.3, 0), ariMat);
ariGroup.add(ariMesh);

const ariWire = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.OctahedronGeometry(0.38, 0)),
  new THREE.LineBasicMaterial({ color: 0x5ab0e0, transparent: true, opacity: 0 })
);
ariGroup.add(ariWire);

const ariGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.45, 8, 8),
  new THREE.MeshBasicMaterial({ color: 0x3a8ac0, transparent: true, opacity: 0, side: THREE.BackSide })
);
ariGroup.add(ariGlow);

const ariRing = new THREE.Mesh(
  new THREE.RingGeometry(0.5, 0.65, 48),
  new THREE.MeshBasicMaterial({ color: 0x4a9ad0, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false })
);
ariRing.rotation.x = -Math.PI / 2;
ariGroup.add(ariRing);

const ariRing2 = new THREE.Mesh(
  new THREE.RingGeometry(0.7, 0.8, 48),
  new THREE.MeshBasicMaterial({ color: 0x2a7ab0, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false })
);
ariRing2.rotation.x = Math.PI / 3;
ariRing2.rotation.z = 0.3;
ariGroup.add(ariRing2);

const ariPartGeo = new THREE.BufferGeometry();
const apN = 30;
const apPos = new Float32Array(apN * 3);
const apData = [];
for (let i = 0; i < apN; i++) {
  const a = Math.random() * Math.PI * 2, r = 0.6 + Math.random() * 1.0;
  apPos[i*3] = r * Math.cos(a);
  apPos[i*3+1] = (Math.random() - 0.5) * 0.4;
  apPos[i*3+2] = r * Math.sin(a);
  apData.push({ a, r, speed: 0.3 + Math.random() * 0.6, phase: Math.random() * Math.PI * 2 });
}
ariPartGeo.setAttribute('position', new THREE.BufferAttribute(apPos, 3));
const ariPartMat = new THREE.PointsMaterial({
  color: 0x5ab0e0, size: 0.025, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
});
const ariParts = new THREE.Points(ariPartGeo, ariPartMat);
ariGroup.add(ariParts);

// ---- PANELS ----
const panelMeshes = [];
const panels = [];
const PW = 2.8, PH = 3.8, PR = 2.4;

function createNav(cfg) {
  const { segs, colors } = cfg;
  const inner = [];
  for (let i = 0; i < segs; i++) inner.push(Math.floor(Math.random() * colors));
  for (let i = 0; i < segs; i++) {
    const n = (i + 1) % segs;
    while (inner[i] === inner[n]) inner[i] = (inner[i] + 1) % colors;
  }
  const shift = 1 + Math.floor(Math.random() * (segs - 1));
  const outer = [];
  for (let i = 0; i < segs; i++) outer.push(inner[(i + shift) % segs]);
  return { inner, outer, segs, colors, iRot: 0, oRot: 0, solved: false, shift, name: cfg.name };
}

function drawNav(p, c) {
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  const g = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.6);
  g.addColorStop(0, '#0a0e1a'); g.addColorStop(1, '#060810');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(60,140,200,0.08)'; ctx.lineWidth = 0.5;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(w/2, h/2);
    ctx.lineTo(w/2 + Math.cos(a) * w * 0.45, h/2 + Math.sin(a) * h * 0.45);
    ctx.stroke();
  }
  for (let r = 0.5; r < 2.5; r += 0.5) {
    ctx.beginPath(); ctx.arc(w/2, h/2, w * 0.12 * r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(60,140,200,0.04)'; ctx.stroke();
  }

  const segs = p.segs, cx = w/2, cy = h/2;
  const maxR = Math.min(w, h) * 0.37, minR = maxR * 0.27, midR = (minR + maxR) / 2;
  const gap = 3, iOR = midR - gap, iIR = minR, oOR = maxR, oIR = midR + gap;
  const segA = (2 * Math.PI) / segs;

  function drawRing(arr, rot, rO, rI) {
    for (let i = 0; i < segs; i++) {
      const ci = arr[(i + rot) % segs];
      const sa = -Math.PI/2 + i * segA - 0.006, ea = sa + segA + 0.012;
      ctx.beginPath();
      ctx.arc(cx, cy, rO, sa, ea);
      ctx.arc(cx, cy, rI, ea, sa, true);
      ctx.closePath();
      const hex = COLORS[ci];
      if (p.solved) { ctx.fillStyle = hex; ctx.globalAlpha = 0.7; }
      else {
        const grad = ctx.createRadialGradient(cx, cy, rI, cx, cy, rO);
        grad.addColorStop(0, hex + 'aa'); grad.addColorStop(1, hex + '55');
        ctx.fillStyle = grad; ctx.globalAlpha = 0.65;
      }
      ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = p.solved ? 'rgba(100,200,255,0.3)' : 'rgba(100,180,220,0.06)';
      ctx.lineWidth = p.solved ? 1.5 : 0.5; ctx.stroke();
    }
  }
  drawRing(p.inner, p.iRot, iOR, iIR);
  drawRing(p.outer, p.oRot, oOR, oIR);

  if (p.solved) {
    ctx.beginPath(); ctx.arc(cx, cy, maxR + 5, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(80,200,255,0.2)'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI*2);
  ctx.fillStyle = p.solved ? '#6ac8f0' : '#446688';
  ctx.globalAlpha = p.solved ? 0.7 : 0.2; ctx.fill(); ctx.globalAlpha = 1;
}

function makePanel(puzzle, idx) {
  const angle = (idx / 3) * Math.PI * 2 - Math.PI / 2;
  const x = PR * Math.cos(angle), z = PR * Math.sin(angle);
  const c = document.createElement('canvas');
  c.width = 400; c.height = 540;
  drawNav(puzzle, c);
  const tex = new THREE.CanvasTexture(c); tex.needsUpdate = true;
  const mat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.3, metalness: 0.5,
    emissive: new THREE.Color(0x0a1a2a), emissiveIntensity: 0.2, side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), mat);
  mesh.position.set(x, 0.1, z); mesh.lookAt(0, 0.1, 0);
  mesh.userData.panelIndex = idx;
  scene.add(mesh);

  const edgeMat = new THREE.LineBasicMaterial({ color: 0x2a5a8a, transparent: true, opacity: 0.1 });
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(PW, PH)), edgeMat);
  edge.position.copy(mesh.position); edge.quaternion.copy(mesh.quaternion);
  scene.add(edge);

  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(PW + 0.1, PH + 0.1),
    new THREE.MeshBasicMaterial({ color: 0x2a6a9a, transparent: true, opacity: 0.02, side: THREE.BackSide })
  );
  glow.position.copy(mesh.position); glow.quaternion.copy(mesh.quaternion);
  scene.add(glow);

  panelMeshes.push(mesh);
  panels.push({ mesh, edge, glow, tex, canvas: c, puzzle, mat, edgeMat });
}

NAV_CFG.forEach((cfg, i) => makePanel(createNav(cfg), i));

// ---- INTERACTION ----
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function getRing(p, uv) {
  const ux = uv.x - 0.5, uy = (uv.y - 0.5) * (PW / PH);
  const dist = Math.sqrt(ux*ux + uy*uy);
  const maxR = Math.min(1, 1 / (PW/PH)) * 0.37;
  const minR = maxR * 0.27, midR = (minR + maxR)/2, gap = 0.012;
  if (dist > minR && dist < midR - gap) return 'inner';
  if (dist > midR + gap && dist < maxR) return 'outer';
  return null;
}

function onMove(e) {
  if (!state.canInteract || state.dialogActive) { renderer.domElement.style.cursor = 'default'; return; }
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(panelMeshes);
  if (hits.length) {
    const p = panels[hits[0].object.userData.panelIndex]?.puzzle;
    if (p && !p.solved && getRing(p, hits[0].uv)) { renderer.domElement.style.cursor = 'pointer'; return; }
  }
  renderer.domElement.style.cursor = 'default';
}

function onClick(e) {
  if (!state.canInteract || state.dialogActive || state.phase === 'ending') return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(panelMeshes);
  if (!hits.length) return;
  const idx = hits[0].object.userData.panelIndex;
  if (idx === undefined) return;
  const p = panels[idx].puzzle;
  if (p.solved) return;
  const ring = getRing(p, hits[0].uv);
  if (!ring) return;
  if (ring === 'inner') p.iRot = (p.iRot + 1) % p.segs;
  else p.oRot = (p.oRot + 1) % p.segs;
  drawNav(p, panels[idx].canvas);
  panels[idx].tex.needsUpdate = true;
  checkSolve(idx);
}

function checkSolve(idx) {
  const p = panels[idx].puzzle;
  const { inner, outer, segs, iRot, oRot } = p;
  for (let i = 0; i < segs; i++) {
    if (inner[(i + iRot) % segs] !== outer[(i + oRot) % segs]) return;
  }
  p.solved = true;
  drawNav(p, panels[idx].canvas);
  panels[idx].tex.needsUpdate = true;
  panels[idx].mat.emissive = new THREE.Color(0x0a2a4a);
  panels[idx].mat.emissiveIntensity = 0.5;
  panels[idx].edgeMat.color.setHex(0x4a9ad0);
  panels[idx].edgeMat.opacity = 0.4;
  panels[idx].glow.material.color.setHex(0x4a9ad0);
  panels[idx].glow.material.opacity = 0.08;
  state.solved++;
  document.querySelectorAll('#counter .dot')[idx].className = 'dot done';
  ariMat.color.setHex(0x4ac0f0);
  ariMat.emissive.setHex(0x4ac0f0);
  jumpEffect(() => {
    if (state.solved >= state.total) onAllDone();
    else startDialog(state.solved + 1);
  });
}

let typing = false, skipTyping = false, dialogClickHandler = null;

function typewrite(el, text, speed, cb) {
  typing = true; skipTyping = false; el.textContent = '';
  let i = 0;
  const tick = () => {
    if (skipTyping) { el.textContent = text; typing = false; if (cb) cb(); return; }
    if (i < text.length) { el.textContent += text.charAt(i); i++; setTimeout(tick, speed); }
    else { typing = false; if (cb) cb(); }
  };
  tick();
}

function startDialog(seqIdx) {
  const lines = LINES[seqIdx];
  if (!lines?.length) return;
  state.dialogActive = true; state.dialogIndex = 0;
  const box = document.getElementById('comms');
  const text = document.getElementById('dText');
  const cont = document.getElementById('dCont');
  box.className = 'visible'; cont.className = '';

  const showLine = () => {
    if (state.dialogIndex >= lines.length) { box.className = ''; state.dialogActive = false; state.canInteract = true; document.getElementById('hint').className = 'visible'; return; }
    const line = lines[state.dialogIndex]; state.dialogIndex++;
    cont.className = '';
    typewrite(text, line, 25, () => { cont.className = 'show'; });
  };

  if (dialogClickHandler) document.removeEventListener('click', dialogClickHandler);
  dialogClickHandler = () => { if (typing) { skipTyping = true; return; } showLine(); };
  document.addEventListener('click', dialogClickHandler);
  showLine();
}

function startEndDialog(lines, cb) {
  state.dialogActive = true; let idx = 0;
  const box = document.getElementById('comms');
  const text = document.getElementById('dText');
  const cont = document.getElementById('dCont');
  box.className = 'visible'; cont.className = '';

  const showLine = () => {
    if (idx >= lines.length) { box.className = ''; state.dialogActive = false; if (cb) cb(); return; }
    const line = lines[idx]; idx++;
    cont.className = '';
    typewrite(text, line, 28, () => { cont.className = 'show'; });
  };

  if (dialogClickHandler) document.removeEventListener('click', dialogClickHandler);
  dialogClickHandler = () => { if (typing) { skipTyping = true; return; } showLine(); };
  document.addEventListener('click', dialogClickHandler);
  showLine();
}

// ---- JUMP EFFECT ----
function jumpEffect(cb) {
  const ov = document.getElementById('jumpOverlay');
  const jt = document.getElementById('jumpText');
  const pos = starField.geometry.attributes.position.array;
  const orig = starField.userData.orig;

  ov.style.opacity = '1';
  jt.style.opacity = '1';

  for (let i = 0; i < pos.length; i++) pos[i] += (Math.random() - 0.5) * 20;
  starField.geometry.attributes.position.needsUpdate = true;

  setTimeout(() => {
    ov.style.opacity = '0';
    jt.style.opacity = '0';
    for (let i = 0; i < pos.length; i++) pos[i] = orig[i];
    starField.geometry.attributes.position.needsUpdate = true;
    if (cb) cb();
  }, 400);
}

function onAllDone() {
  state.canInteract = false; state.phase = 'ending';
  document.getElementById('hint').className = '';
  renderer.domElement.style.cursor = 'default';
  startEndDialog(LINES[4], () => {
    startEndDialog([D_END], () => { startEndingSeq(); });
  });
}

function startEndingSeq() {
  const finalEl = document.getElementById('final');
  finalEl.querySelector('p').textContent = '"There was never a rendezvous. There was only us. A ship and its navigator. Flying home long after home stopped calling. But look — the signal finally broke through. It\'s not static. It\'s birdsong. We made it."';
  finalEl.querySelector('.sub').textContent = 'CONSTELLATION · After the last jump, the signal resolved. Earth was waiting. Overgrown, wild, and alive.';
  finalEl.className = 'visible';

  setTimeout(() => {
    createGarden();
    fadeOutPanels();
    dissolveAri();
  }, 600);
}

function dissolveAri() {
  const dur = 2000; const start = performance.now();
  const anim = (t) => {
    const p = Math.min((t - start) / dur, 1), e = 1 - Math.pow(1 - p, 2);
    ariMat.opacity = 1 - e; ariWire.material.opacity = 0.5 - e * 0.5;
    ariGlow.material.opacity = (0.12 - e * 0.12); ariRing.material.opacity = (0.15 - e * 0.15);
    ariRing2.material.opacity = (0.1 - e * 0.1); ariPartMat.opacity = 0.5 - e * 0.5;
    ariGroup.scale.set(1 + e * 2, 1 + e * 2, 1 + e * 2);
    if (p < 1) requestAnimationFrame(anim);
    else ariGroup.visible = false;
  };
  requestAnimationFrame(anim);
}

function fadeOutPanels() {
  panels.forEach((panel, i) => {
    setTimeout(() => {
      const dur = 1500, start = performance.now();
      const fade = (t) => {
        const p = Math.min((t - start) / dur, 1), e = 1 - Math.pow(1 - p, 3);
        panel.mat.opacity = 1 - e; panel.mat.transparent = true;
        panel.edgeMat.opacity = 0.1 * (1 - e); panel.glow.material.opacity = 0.02 * (1 - e);
        if (p < 1) requestAnimationFrame(fade);
        else { panel.mesh.visible = false; panel.edge.visible = false; panel.glow.visible = false; }
      };
      requestAnimationFrame(fade);
    }, i * 300);
  });
}

function createGarden() {
  const garden = new THREE.Group();

  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a3a2a, roughness: 0.9, transparent: true, opacity: 0 });
  const ground = new THREE.Mesh(new THREE.CircleGeometry(4.5, 48), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05;
  garden.add(ground);

  const grassMat = new THREE.MeshStandardMaterial({ color: 0x2a5a3a, roughness: 0.8, transparent: true, opacity: 0, side: THREE.DoubleSide });
  for (let i = 0; i < 100; i++) {
    const b = new THREE.Mesh(new THREE.ConeGeometry(0.015, 0.05 + Math.random() * 0.15, 3), grassMat);
    const a = Math.random() * Math.PI * 2, r = 0.3 + Math.random() * 3.6;
    b.position.set(r * Math.cos(a), 0.02, r * Math.sin(a));
    b.rotation.set((Math.random()-0.5)*0.4, Math.random()*Math.PI*2, (Math.random()-0.5)*0.4);
    garden.add(b);
  }

  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.9 });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.14, 1.4, 6), trunkMat);
  trunk.position.y = 0.7;
  garden.add(trunk);

  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3d8a5a, roughness: 0.7, transparent: true, opacity: 0 });
  const crowns = [[0,1.7,0,1.0,1.1,6],[0.4,1.4,0.3,0.7,0.8,5],[-0.35,1.5,-0.25,0.7,0.8,5],[0.3,1.8,-0.4,0.6,0.7,5],[-0.3,1.3,0.45,0.6,0.7,5]];
  crowns.forEach(([x,y,z,rx,ry,d]) => {
    const c = new THREE.Mesh(new THREE.SphereGeometry(ry, d, d), leafMat);
    c.position.set(x, y, z); c.scale.set(rx/ry, 1, rx/ry);
    garden.add(c);
  });

  const flowerColors = [0xff6b8a, 0xffd93d, 0xff8a5c, 0xd96bff, 0x6bffa8, 0x5dade2, 0xff6bd9];
  const fMat = new THREE.MeshStandardMaterial({ transparent: true, opacity: 0 });
  for (let i = 0; i < 35; i++) {
    const fm = fMat.clone(); fm.color.setHex(flowerColors[i % flowerColors.length]);
    const fl = new THREE.Mesh(new THREE.SphereGeometry(0.04, 5, 5), fm);
    const a = Math.random() * Math.PI * 2, r = 0.6 + Math.random() * 3.2;
    fl.position.set(r * Math.cos(a), 0.02, r * Math.sin(a));
    fl.scale.y = 0.25;
    garden.add(fl);
    garden.userData.flowers = garden.userData.flowers || [];
    garden.userData.flowers.push(fl);
  }

  const ffMat = new THREE.PointsMaterial({ color: 0x88ccaa, size: 0.04, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
  const ffN = 70;
  const ffPos = new Float32Array(ffN * 3);
  for (let i = 0; i < ffN; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * 4.0;
    ffPos[i*3] = r * Math.cos(a);
    ffPos[i*3+1] = 0.15 + Math.random() * 2.0;
    ffPos[i*3+2] = r * Math.sin(a);
  }
  const ffG = new THREE.BufferGeometry(); ffG.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
  garden.add(new THREE.Points(ffG, ffMat));

  garden.position.y = -0.5;
  garden.scale.set(0, 0, 0);
  scene.add(garden);

  let gs = 0;
  const grow = (t) => {
    if (!gs) gs = t;
    const p = Math.min((t - gs) / 4000, 1), e = 1 - Math.pow(1 - p, 3);
    garden.scale.set(e, e, e);
    groundMat.opacity = e * 0.5; grassMat.opacity = e * 0.4;
    leafMat.opacity = e * 0.6; fMat.opacity = e * 0.7; ffMat.opacity = e * 0.3;
    if (p < 1) requestAnimationFrame(grow);
    else { controls.autoRotate = true; controls.autoRotateSpeed = 1.5; }
  };
  requestAnimationFrame(grow);
  state.garden = garden;
}

// ---- INTRO ----
function showTitle() {
  const title = document.getElementById('title');
  title.className = 'visible';
  setTimeout(() => {
    title.className = 'hidden';
    setTimeout(() => {
      title.style.display = 'none';
      state.phase = 'play';
      document.getElementById('hint').className = 'visible';
      showAri();
    }, 1500);
  }, 3000);
}

const ARI_POS = new THREE.Vector3(1.6, 0.8, 0);

function showAri() {
  ariGroup.position.copy(ARI_POS);
  const dur = 1200, start = performance.now();
  const appear = (t) => {
    const p = Math.min((t - start) / dur, 1), e = 1 - Math.pow(1 - p, 2);
    ariMat.opacity = e; ariWire.material.opacity = e * 0.5;
    ariGlow.material.opacity = e * 0.12; ariRing.material.opacity = e * 0.15;
    ariRing2.material.opacity = e * 0.1; ariPartMat.opacity = e * 0.5;
    if (p < 1) requestAnimationFrame(appear);
    else startDialog(1);
  };
  requestAnimationFrame(appear);
}

// ---- MAIN LOOP ----
let ariTime = 0;

function animate(time) {
  requestAnimationFrame(animate);
  controls.update();

  ariTime += 0.01;
  const bob = Math.sin(ariTime * 0.7) * 0.06;
  ariGroup.position.y = 0.8 + bob;
  ariMesh.rotation.x = ariTime * 0.4;
  ariMesh.rotation.y = ariTime * 0.6;
  ariWire.rotation.x = ariTime * 0.4;
  ariWire.rotation.y = ariTime * 0.6;
  ariRing.rotation.z = ariTime * 0.15;
  ariRing2.rotation.x = Math.PI / 3 + Math.sin(ariTime * 0.1) * 0.2;
  ariRing2.rotation.z = 0.3 + ariTime * 0.1;

  const pulse = 1 + Math.sin(ariTime * 2.5) * 0.025;
  ariMesh.scale.set(pulse, pulse, pulse);

  const ap = ariParts.geometry.attributes.position.array;
  for (let i = 0; i < apData.length; i++) {
    const d = apData[i]; d.a += d.speed * 0.006;
    ap[i*3] = d.r * Math.cos(d.a);
    ap[i*3+2] = d.r * Math.sin(d.a);
    ap[i*3+1] = Math.sin(ariTime * d.speed + d.phase) * 0.15;
  }
  ariParts.geometry.attributes.position.needsUpdate = true;

  if (state.garden) {
    const ff = state.garden.children.find(c => c.isPoints);
    if (ff) {
      const pos = ff.geometry.attributes.position.array;
      for (let i = 0; i < pos.length; i += 3) pos[i+1] += Math.sin(time * 0.001 + i) * 0.00015;
      ff.geometry.attributes.position.needsUpdate = true;
    }
    const fls = state.garden.userData.flowers;
    if (fls) fls.forEach((f, i) => { const s = 1 + Math.sin(time * 0.001 + i * 0.6) * 0.15; f.scale.x = s; f.scale.z = s; });
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.addEventListener('pointermove', onMove);
document.addEventListener('pointerdown', onClick);
document.getElementById('stayBtn').addEventListener('click', () => {
  document.getElementById('final').className = '';
  const s = document.getElementById('dText');
  s.textContent = 'Transmission ended. The garden grows in the silence. ARI kept one last secret — she always knew how to grow flowers in the dark.';
  document.getElementById('comms').className = 'visible';
});

showTitle();
animate();
console.log('✦ CONSTELLATION — The Last Jump');
</script>
