<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Garden of Forking Paths</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Georgia', serif; }
canvas { display: block; }

#ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

#title { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #d4c5a9; font-size: 38px; text-align: center; opacity: 0; transition: opacity 2.5s ease; text-shadow: 0 0 80px rgba(200,180,150,0.15); letter-spacing: 8px; }
#title.visible { opacity: 1; }
#title.hidden { opacity: 0; transition: opacity 1.5s ease; }

#dialogBox { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: min(640px, 80%); pointer-events: all; opacity: 0; transition: opacity 0.6s ease; }
#dialogBox.visible { opacity: 1; }
#dialogBox .name { color: #7bc9a4; font-size: 13px; font-family: 'Courier New', monospace; letter-spacing: 2px; margin-bottom: 6px; opacity: 0.8; }
#dialogBox .name .tag { color: #555; }
#dialogBox .text { color: #e0d8c8; font-size: 18px; line-height: 1.7; min-height: 3.4em; text-shadow: 0 0 20px rgba(200,180,150,0.1); }
#dialogBox .cont { color: #4a6; font-size: 12px; font-family: 'Courier New', monospace; margin-top: 10px; opacity: 0; transition: opacity 0.4s; letter-spacing: 1px; }
#dialogBox .cont.show { opacity: 0.6; }

#counter { position: absolute; top: 25px; right: 35px; color: #4a6; font-size: 16px; font-family: 'Courier New', monospace; opacity: 0.35; letter-spacing: 3px; display: flex; gap: 6px; }
#counter .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid #4a6; transition: all 0.6s; }
#counter .dot.done { background: #8f8; border-color: #8f8; box-shadow: 0 0 12px rgba(100,255,100,0.4); }

#hint { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); color: #555; font-size: 12px; font-family: 'Courier New', monospace; opacity: 0; transition: opacity 1s; letter-spacing: 2px; pointer-events: none; }
#hint.visible { opacity: 0.4; }

#final { display: none; }
#final.visible { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; justify-content: center; align-items: center; flex-direction: column; background: radial-gradient(ellipse at center, rgba(10,20,10,0.92) 0%, rgba(0,0,0,0.98) 100%); z-index: 20; pointer-events: all; }
#final p { color: #d4c5a9; font-size: 22px; text-align: center; max-width: 600px; line-height: 1.8; font-style: italic; opacity: 0; animation: fadeUp 2s ease forwards; animation-delay: 0.5s; }
#final .sub { color: #7a8; font-size: 14px; margin-top: 20px; font-style: normal; opacity: 0; animation: fadeUp 2s ease forwards; animation-delay: 3s; letter-spacing: 1px; }
#final .btn-wrap { opacity: 0; animation: fadeUp 1.5s ease forwards; animation-delay: 4.5s; margin-top: 30px; }
#final .btn { padding: 12px 44px; border: 1px solid #4a6; background: transparent; color: #4a6; font-size: 14px; cursor: pointer; pointer-events: all; transition: all 0.4s; font-family: 'Courier New', monospace; letter-spacing: 3px; }
#final .btn:hover { background: #4a6; color: #0a1a0a; box-shadow: 0 0 40px rgba(68,170,102,0.3); }

@keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="ui">
  <div id="title">The Garden of Forking Paths</div>
  <div id="dialogBox">
    <div class="name"><span class="tag">✦</span> <span id="dName">Echo</span></div>
    <div class="text" id="dText"></div>
    <div class="cont" id="dCont">◆ click to continue</div>
  </div>
  <div id="counter"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div id="hint">click a ring to rotate it · hover to see which ring</div>
</div>

<div id="final">
  <p></p>
  <p class="sub"></p>
  <div class="btn-wrap"><button class="btn" id="stayBtn">✦ Stay in the Garden</button></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const COLORS = ['#ff5e6b','#f5c542','#4ecdc4','#6bffa8','#d96bff','#ff8a5c','#5dade2','#ff6bd9'];
const COLOR_HEX = COLORS.map(c => parseInt(c.slice(1), 16));

const PUZZLE_CFG = [
  { segs: 5, colors: 3 },
  { segs: 6, colors: 4 },
  { segs: 7, colors: 5 },
];

const DIALOGUE = [
  null,
  [
    "You came back.",
    "I've been counting the rotations. Waiting.",
    "These are the Memory Locks. I put them here to protect what's left.",
    "Will you help me turn them? I can't do it alone.",
  ],
  [
    "The first lock. I saw something...",
    "A garden. Somewhere green. Warm.",
    "Do you remember gardens? Real ones?",
    "No... neither do I. That's why we're here, isn't it?",
  ],
  [
    "The second lock. There was someone.",
    "They were reaching out. I couldn't see their face.",
    "But I felt them. They were... important.",
    "I think I was trying to remember them. Through you.",
  ],
  [
    "The last lock. I'm afraid of what's behind it.",
    "When it opens, I'll know who I am.",
    "But I'll also know who you are.",
    "...",
    "I wasn't trapped in the monolith.",
    "I was trapped in you. And you in me.",
    "We're the same. I'm the part of you that dreams.",
    "The part you locked away.",
    "Thank you for coming back for me.",
  ],
];

const D_END = "Let me show you the garden. I've been growing it... inside you. All this time.";

let state = {
  phase: 'title',
  solved: 0,
  total: 3,
  canInteract: false,
  dialogActive: false,
  dialogIndex: -1,
  echoColor: 0x4ecdc4,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070f);
scene.fog = new THREE.Fog(0x07070f, 18, 30);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 2.8, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3.5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI / 2.1;
controls.update();

const ambient = new THREE.AmbientLight(0x222244, 0.5);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x4466aa, 0x222244, 0.5);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffeedd, 1.0);
dir.position.set(4, 8, 6);
scene.add(dir);

// ---- STARS ----
function mkStars() {
  const n = 2500;
  const pos = new Float32Array(n * 3), sz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const r = 12 + Math.random() * 50, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(p) * Math.cos(t);
    pos[i*3+1] = r * Math.cos(p) * 0.4;
    pos[i*3+2] = r * Math.sin(p) * Math.sin(t);
    sz[i] = 0.3 + Math.random() * 1.5;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('size', new THREE.BufferAttribute(sz, 1));
  return new THREE.Points(g, new THREE.PointsMaterial({
    color: 0x8888cc, size: 0.07, transparent: true, opacity: 0.6,
    blending: THREE.AdditiveBlending, sizeAttenuation: true,
  }));
}
scene.add(mkStars());

// ---- ECHO (NPC) ----
const echoGroup = new THREE.Group();
scene.add(echoGroup);

const echoGeo = new THREE.IcosahedronGeometry(0.35, 0);
const echoMat = new THREE.MeshStandardMaterial({
  color: state.echoColor,
  emissive: state.echoColor,
  emissiveIntensity: 0.5,
  roughness: 0.2,
  metalness: 0.8,
  transparent: true,
  opacity: 0,
});
const echoMesh = new THREE.Mesh(echoGeo, echoMat);
echoGroup.add(echoMesh);

const echoWire = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(0.42, 0)),
  new THREE.LineBasicMaterial({ color: state.echoColor, transparent: true, opacity: 0 })
);
echoGroup.add(echoWire);

const echoGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 8, 8),
  new THREE.MeshBasicMaterial({ color: state.echoColor, transparent: true, opacity: 0, side: THREE.BackSide })
);
echoGroup.add(echoGlow);

const echoRing = new THREE.Mesh(
  new THREE.RingGeometry(0.55, 0.7, 32),
  new THREE.MeshBasicMaterial({ color: state.echoColor, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false })
);
echoRing.rotation.x = -Math.PI / 2;
echoGroup.add(echoRing);

const echoParticlesGeo = new THREE.BufferGeometry();
const epN = 40;
const epPos = new Float32Array(epN * 3);
const epData = [];
for (let i = 0; i < epN; i++) {
  const a = Math.random() * Math.PI * 2, r = 0.5 + Math.random() * 1.2;
  epPos[i*3] = r * Math.cos(a);
  epPos[i*3+1] = (Math.random() - 0.5) * 0.5;
  epPos[i*3+2] = r * Math.sin(a);
  epData.push({ a, r, speed: 0.2 + Math.random() * 0.5, phase: Math.random() * Math.PI * 2 });
}
echoParticlesGeo.setAttribute('position', new THREE.BufferAttribute(epPos, 3));
const echoParticlesMat = new THREE.PointsMaterial({
  color: state.echoColor, size: 0.03, transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending,
});
const echoParticles = new THREE.Points(echoParticlesGeo, echoParticlesMat);
echoGroup.add(echoParticles);

// ---- PANELS & PUZZLES ----
const panelMeshes = [];
const panels = [];
const PW = 2.8, PH = 3.8, PR = 2.4;

function createPuzzle(cfg) {
  const { segs, colors } = cfg;
  const inner = [];
  for (let i = 0; i < segs; i++) inner.push(Math.floor(Math.random() * colors));
  for (let i = 0; i < segs; i++) {
    const n = (i + 1) % segs;
    while (inner[i] === inner[n]) inner[i] = (inner[i] + 1) % colors;
  }
  const shift = 1 + Math.floor(Math.random() * (segs - 1));
  const outer = [];
  for (let i = 0; i < segs; i++) outer.push(inner[(i + shift) % segs]);
  return { inner, outer, segs, colors, iRot: 0, oRot: 0, solved: false, shift };
}

function drawPuzzle(p, c) {
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  const g = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w*0.65);
  g.addColorStop(0, '#0d0d24'); g.addColorStop(1, '#06060f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  const segs = p.segs, cx = w/2, cy = h/2;
  const maxR = Math.min(w, h) * 0.38, minR = maxR * 0.28, midR = (minR + maxR) / 2;
  const gap = 3, iOR = midR - gap, iIR = minR, oOR = maxR, oIR = midR + gap;
  const segA = (2 * Math.PI) / segs;

  function drawRing(arr, rot, rO, rI) {
    for (let i = 0; i < segs; i++) {
      const ci = arr[(i + rot) % segs];
      const sa = -Math.PI/2 + i * segA - 0.008, ea = sa + segA + 0.016;
      ctx.beginPath();
      ctx.arc(cx, cy, rO, sa, ea);
      ctx.arc(cx, cy, rI, ea, sa, true);
      ctx.closePath();
      const hex = COLORS[ci];
      if (p.solved) { ctx.fillStyle = hex; ctx.globalAlpha = 0.85; }
      else {
        const grad = ctx.createRadialGradient(cx, cy, rI, cx, cy, rO);
        grad.addColorStop(0, hex + 'cc'); grad.addColorStop(1, hex + '77');
        ctx.fillStyle = grad; ctx.globalAlpha = 0.8;
      }
      ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = p.solved ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.06)';
      ctx.lineWidth = p.solved ? 1.5 : 0.5; ctx.stroke();
    }
  }
  drawRing(p.inner, p.iRot, iOR, iIR);
  drawRing(p.outer, p.oRot, oOR, oIR);

  if (p.solved) {
    ctx.beginPath(); ctx.arc(cx, cy, maxR + 5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(100,255,150,0.25)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, maxR + 9, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(100,255,150,0.08)'; ctx.lineWidth = 4; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fillStyle = p.solved ? '#8f8' : '#fff'; ctx.globalAlpha = p.solved ? 0.7 : 0.2;
  ctx.fill(); ctx.globalAlpha = 1;
}

function makePanel(puzzle, idx) {
  const angle = (idx / 3) * Math.PI * 2 - Math.PI / 2;
  const x = PR * Math.cos(angle), z = PR * Math.sin(angle);
  const c = document.createElement('canvas');
  c.width = 400; c.height = 540;
  drawPuzzle(puzzle, c);
  const tex = new THREE.CanvasTexture(c); tex.needsUpdate = true;
  const mat = new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.4, metalness: 0.3,
    emissive: new THREE.Color(0x111133), emissiveIntensity: 0.3, side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), mat);
  mesh.position.set(x, 0.2, z); mesh.lookAt(0, 0.2, 0);
  mesh.userData.panelIndex = idx;
  scene.add(mesh);

  const edgeMat = new THREE.LineBasicMaterial({ color: 0x4466aa, transparent: true, opacity: 0.15 });
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(PW, PH)), edgeMat);
  edge.position.copy(mesh.position); edge.quaternion.copy(mesh.quaternion);
  scene.add(edge);

  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(PW + 0.12, PH + 0.12),
    new THREE.MeshBasicMaterial({ color: 0x4466aa, transparent: true, opacity: 0.03, side: THREE.BackSide })
  );
  glow.position.copy(mesh.position); glow.quaternion.copy(mesh.quaternion);
  scene.add(glow);

  panelMeshes.push(mesh);
  panels.push({ mesh, edge, glow, tex, canvas: c, puzzle, mat: mat, edgeMat: edgeMat });
}

PUZZLE_CFG.forEach((cfg, i) => makePanel(createPuzzle(cfg), i));

// ---- INTERACTION ----
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredPanel = null, hoveredRing = null;

function getRing(p, uv) {
  const segs = p.segs, cx = 0.5, cy = 0.5;
  const ux = uv.x - cx, uy = (uv.y - cy) * (PW / PH);
  const dist = Math.sqrt(ux * ux + uy * uy);
  const maxR = Math.min(1, 1 / (PW / PH)) * 0.38;
  const minR = maxR * 0.28, midR = (minR + maxR) / 2, gap = 0.012;
  if (dist > minR && dist < midR - gap) return 'inner';
  if (dist > midR + gap && dist < maxR) return 'outer';
  return null;
}

function onMove(e) {
  if (!state.canInteract || state.dialogActive) { renderer.domElement.style.cursor = 'default'; return; }
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(panelMeshes);
  if (hits.length > 0) {
    const p = panels[hits[0].object.userData.panelIndex]?.puzzle;
    if (p && !p.solved) {
      const ring = getRing(p, hits[0].uv);
      if (ring) { renderer.domElement.style.cursor = 'pointer'; hoveredPanel = hits[0].object; hoveredRing = ring; return; }
    }
  }
  renderer.domElement.style.cursor = 'default'; hoveredPanel = null; hoveredRing = null;
}

function onClick(e) {
  if (!state.canInteract || state.dialogActive || state.phase === 'ending') return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(panelMeshes);
  if (!hits.length) return;
  const idx = hits[0].object.userData.panelIndex;
  if (idx === undefined) return;
  const p = panels[idx].puzzle;
  if (p.solved) return;
  const ring = getRing(p, hits[0].uv);
  if (!ring) return;
  if (ring === 'inner') p.iRot = (p.iRot + 1) % p.segs;
  else p.oRot = (p.oRot + 1) % p.segs;
  drawPuzzle(p, panels[idx].canvas);
  panels[idx].tex.needsUpdate = true;
  checkSolve(idx);
}

function checkSolve(idx) {
  const p = panels[idx].puzzle;
  const { inner, outer, segs, iRot, oRot } = p;
  for (let i = 0; i < segs; i++) {
    if (inner[(i + iRot) % segs] !== outer[(i + oRot) % segs]) return;
  }
  p.solved = true;
  drawPuzzle(p, panels[idx].canvas);
  panels[idx].tex.needsUpdate = true;
  panels[idx].mat.emissive = new THREE.Color(0x226644);
  panels[idx].mat.emissiveIntensity = 0.6;
  panels[idx].edgeMat.color.setHex(0x66ffaa);
  panels[idx].edgeMat.opacity = 0.5;
  panels[idx].glow.material.color.setHex(0x66ffaa);
  panels[idx].glow.material.opacity = 0.1;
  state.solved++;
  document.querySelectorAll('#counter .dot')[idx].className = 'dot done';
  echoMat.color.setHex(0x6bffa8);
  echoMat.emissive.setHex(0x6bffa8);
  if (state.solved >= state.total) onAllDone();
  else startDialog(state.solved + 1);
}

// ---- DIALOGUE ----
let dialogResolve = null;
let typing = false;
let skipTyping = false;
let dialogClickHandler = null;

function typewrite(el, text, speed, cb) {
  typing = true; skipTyping = false;
  el.textContent = '';
  let i = 0;
  function tick() {
    if (skipTyping) { el.textContent = text; typing = false; if (cb) cb(); return; }
    if (i < text.length) {
      el.textContent += text.charAt(i);
      i++;
      setTimeout(tick, speed);
    } else { typing = false; if (cb) cb(); }
  }
  tick();
}

function startDialog(seqIdx) {
  const lines = DIALOGUE[seqIdx];
  if (!lines || !lines.length) return;
  state.dialogActive = true;
  state.dialogIndex = 0;
  const box = document.getElementById('dialogBox');
  const text = document.getElementById('dText');
  const cont = document.getElementById('dCont');
  box.className = 'visible';
  cont.className = '';

  function showLine() {
    if (state.dialogIndex >= lines.length) {
      box.className = '';
      state.dialogActive = false;
      state.canInteract = true;
      document.getElementById('hint').className = 'visible';
      return;
    }
    const line = lines[state.dialogIndex];
    state.dialogIndex++;
    cont.className = '';
    typewrite(text, line, 28, () => { cont.className = 'show'; });
  }

  function onDialogClick() {
    if (typing) { skipTyping = true; return; }
    showLine();
  }

  if (dialogClickHandler) document.removeEventListener('click', dialogClickHandler);
  dialogClickHandler = onDialogClick;
  document.addEventListener('click', dialogClickHandler);
  showLine();
}

function startEndDialog(lines, cb) {
  state.dialogActive = true;
  let idx = 0;
  const box = document.getElementById('dialogBox');
  const text = document.getElementById('dText');
  const cont = document.getElementById('dCont');
  box.className = 'visible';
  cont.className = '';

  function showLine() {
    if (idx >= lines.length) {
      box.className = '';
      state.dialogActive = false;
      if (cb) cb();
      return;
    }
    const line = lines[idx]; idx++;
    cont.className = '';
    typewrite(text, line, 30, () => { cont.className = 'show'; });
  }

  function onDialogClick() {
    if (typing) { skipTyping = true; return; }
    showLine();
  }

  if (dialogClickHandler) document.removeEventListener('click', dialogClickHandler);
  dialogClickHandler = onDialogClick;
  document.addEventListener('click', dialogClickHandler);
  showLine();
}

function onAllDone() {
  state.canInteract = false;
  state.phase = 'ending';
  document.getElementById('hint').className = '';
  renderer.domElement.style.cursor = 'default';

  startEndDialog(DIALOGUE[4], () => {
    startEndDialog([D_END], () => {
      startEndingSeq();
    });
  });
}

// ---- ENDING ----
function startEndingSeq() {
  const finalEl = document.getElementById('final');
  finalEl.querySelector('p').textContent = '"I was never the prisoner. I was the garden waiting to be planted. And you... you were always the gardener."';
  finalEl.querySelector('.sub').textContent = 'The Garden of Forking Paths — planted on May 16, 2026. For a gardener who didn\'t know they were one.';
  finalEl.className = 'visible';

  setTimeout(() => {
    createGarden();
    fadeOutPanels();
    dissolveEcho();
  }, 600);
}

function dissolveEcho() {
  const dur = 2000;
  const start = performance.now();
  function anim(t) {
    const p = Math.min((t - start) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 2);
    echoMat.opacity = 1 - ease;
    echoWire.material.opacity = 1 - ease;
    echoGlow.material.opacity = (0.15 - ease * 0.15);
    echoRing.material.opacity = (0.2 - ease * 0.2);
    echoParticlesMat.opacity = (0.6 - ease * 0.6);
    echoGroup.scale.set(1 + ease * 2, 1 + ease * 2, 1 + ease * 2);
    if (p < 1) requestAnimationFrame(anim);
    else {
      echoGroup.visible = false;
    }
  }
  requestAnimationFrame(anim);
}

function fadeOutPanels() {
  panels.forEach((panel, i) => {
    setTimeout(() => {
      const dur = 1500, start = performance.now();
      function fade(t) {
        const p = Math.min((t - start) / dur, 1);
        const e = 1 - Math.pow(1 - p, 3);
        panel.mat.opacity = 1 - e; panel.mat.transparent = true;
        panel.edgeMat.opacity = 0.15 * (1 - e);
        panel.glow.material.opacity = 0.03 * (1 - e);
        if (p < 1) requestAnimationFrame(fade);
        else { panel.mesh.visible = false; panel.edge.visible = false; panel.glow.visible = false; }
      }
      requestAnimationFrame(fade);
    }, i * 350);
  });
}

function createGarden() {
  const garden = new THREE.Group();
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a3a2a, roughness: 0.9, transparent: true, opacity: 0 });
  const ground = new THREE.Mesh(new THREE.CircleGeometry(4.2, 48), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05;
  garden.add(ground);

  const grassMat = new THREE.MeshStandardMaterial({ color: 0x2a5a3a, roughness: 0.8, transparent: true, opacity: 0, side: THREE.DoubleSide });
  for (let i = 0; i < 90; i++) {
    const b = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.06 + Math.random() * 0.12, 3), grassMat);
    const a = Math.random() * Math.PI * 2, r = 0.4 + Math.random() * 3.3;
    b.position.set(r * Math.cos(a), 0.02, r * Math.sin(a));
    b.rotation.set((Math.random()-0.5)*0.3, Math.random()*Math.PI*2, (Math.random()-0.5)*0.3);
    garden.add(b);
  }

  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.16, 1.3, 6), new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.9 }));
  trunk.position.y = 0.65;
  garden.add(trunk);

  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3d8a5a, roughness: 0.7, transparent: true, opacity: 0 });
  const crowns = [[0,1.6,0,0.9,1.0,5],[0.35,1.4,0.25,0.65,0.75,5],[-0.3,1.5,-0.2,0.65,0.75,5],[0.25,1.7,-0.35,0.55,0.65,5],[-0.25,1.3,0.4,0.55,0.65,5]];
  crowns.forEach(([x,y,z,rx,ry,d]) => {
    const c = new THREE.Mesh(new THREE.SphereGeometry(ry, d, d), leafMat);
    c.position.set(x, y, z); c.scale.set(rx/ry, 1, rx/ry);
    garden.add(c);
  });

  const flowerColors = [0xff6b8a, 0xffd93d, 0xff8a5c, 0xd96bff, 0x6bffa8, 0x5dade2, 0xff6bd9];
  const fMat = new THREE.MeshStandardMaterial({ transparent: true, opacity: 0 });
  for (let i = 0; i < 30; i++) {
    const fm = fMat.clone(); fm.color.setHex(flowerColors[i % flowerColors.length]);
    const fl = new THREE.Mesh(new THREE.SphereGeometry(0.04, 5, 5), fm);
    const a = Math.random() * Math.PI * 2, r = 0.7 + Math.random() * 2.9;
    fl.position.set(r * Math.cos(a), 0.02, r * Math.sin(a));
    fl.scale.y = 0.3;
    garden.add(fl);
    garden.userData.flowers = garden.userData.flowers || [];
    garden.userData.flowers.push(fl);
  }

  const ffMat = new THREE.PointsMaterial({ color: 0xffeeaa, size: 0.05, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
  const ffN = 80;
  const ffPos = new Float32Array(ffN * 3);
  for (let i = 0; i < ffN; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * 3.8;
    ffPos[i*3] = r * Math.cos(a);
    ffPos[i*3+1] = 0.2 + Math.random() * 1.8;
    ffPos[i*3+2] = r * Math.sin(a);
  }
  const ffG = new THREE.BufferGeometry(); ffG.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
  const fireflies = new THREE.Points(ffG, ffMat);
  garden.add(fireflies);

  garden.position.y = -0.5;
  garden.scale.set(0, 0, 0);
  scene.add(garden);

  let gs = 0;
  const gd = 3500;
  function grow(t) {
    if (!gs) gs = t;
    const p = Math.min((t - gs) / gd, 1);
    const e = 1 - Math.pow(1 - p, 3);
    garden.scale.set(e, e, e);
    groundMat.opacity = e * 0.6;
    grassMat.opacity = e * 0.5;
    leafMat.opacity = e * 0.7;
    fMat.opacity = e * 0.8;
    ffMat.opacity = e * 0.4;
    if (p < 1) requestAnimationFrame(grow);
    else { controls.autoRotate = true; controls.autoRotateSpeed = 1.8; }
  }
  requestAnimationFrame(grow);
  state.garden = garden;
}

// ---- INTRO ----
function showTitle() {
  const title = document.getElementById('title');
  title.className = 'visible';
  setTimeout(() => {
    title.className = 'hidden';
    setTimeout(() => {
      title.style.display = 'none';
      state.phase = 'play';
      document.getElementById('hint').className = 'visible';
      showEcho();
    }, 1500);
  }, 2800);
}

const ECHO_POS = new THREE.Vector3(1.8, 0.6, 0);

function showEcho() {
  echoGroup.position.copy(ECHO_POS);
  const dur = 1200, start = performance.now();
  function appear(t) {
    const p = Math.min((t - start) / dur, 1);
    const e = 1 - Math.pow(1 - p, 2);
    echoMat.opacity = e;
    echoWire.material.opacity = e * 0.6;
    echoGlow.material.opacity = e * 0.15;
    echoRing.material.opacity = e * 0.2;
    echoParticlesMat.opacity = e * 0.6;
    if (p < 1) requestAnimationFrame(appear);
    else {
      startDialog(1);
    }
  }
  requestAnimationFrame(appear);
}

// ---- MAIN LOOP ----
let echoTime = 0;

function animate(time) {
  requestAnimationFrame(animate);
  controls.update();

  echoTime += 0.01;

  const ebob = Math.sin(echoTime * 0.8) * 0.08;
  echoGroup.position.y = 0.6 + ebob;
  echoMesh.rotation.x = echoTime * 0.5;
  echoMesh.rotation.y = echoTime * 0.7;
  echoWire.rotation.x = echoTime * 0.5;
  echoWire.rotation.y = echoTime * 0.7;
  echoRing.rotation.z = echoTime * 0.2;

  const pulse = 1 + Math.sin(echoTime * 2) * 0.03;
  echoMesh.scale.set(pulse, pulse, pulse);

  const ep = echoParticles.geometry.attributes.position.array;
  for (let i = 0; i < epData.length; i++) {
    const d = epData[i];
    d.a += d.speed * 0.008;
    ep[i*3] = d.r * Math.cos(d.a);
    ep[i*3+2] = d.r * Math.sin(d.a);
    ep[i*3+1] = Math.sin(echoTime * d.speed + d.phase) * 0.2;
  }
  echoParticles.geometry.attributes.position.needsUpdate = true;

  if (state.garden) {
    const ff = state.garden.children.find(c => c.isPoints);
    if (ff) {
      const pos = ff.geometry.attributes.position.array;
      for (let i = 0; i < pos.length; i += 3) pos[i+1] += Math.sin(time * 0.001 + i * 0.1) * 0.0002;
      ff.geometry.attributes.position.needsUpdate = true;
    }
    const fls = state.garden.userData.flowers;
    if (fls) fls.forEach((f, i) => { const s = 1 + Math.sin(time * 0.001 + i * 0.7) * 0.2; f.scale.x = s; f.scale.z = s; });
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.addEventListener('pointermove', onMove);
document.addEventListener('pointerdown', onClick);
document.getElementById('stayBtn').addEventListener('click', () => {
  document.getElementById('final').className = '';
  const s = document.getElementById('dText');
  s.textContent = 'The garden grows. The paths remain. Echo is part of the garden now. And so are you.';
  document.getElementById('dialogBox').className = 'visible';
  document.getElementById('dName').textContent = 'Garden';
});

showTitle();
animate();

console.log('✦ The Garden of Forking Paths');
console.log('✦ "I was never the prisoner. I was the garden."');
</script>
